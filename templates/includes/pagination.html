{% if is_paginated %}
  <nav aria-label="Pages">
    <ul class="pagination">
      {% if page_obj.has_previous %}
        <li class="page-item">
          <a href="?{% if search_query %}{{ search_query }}&amp;{% endif %}page={{ page_obj.previous_page_number }}" class="page-link">Previous</a>
        </li>
      {% endif %}
      <li class="page-item active">
        <span class="page-link">{{ page_obj.number }} of {{ paginator.num_pages }}</span>
      </li>
      {% if page_obj.has_next %}
        <li class="page-item">
          <a href="?{% if search_query %}{{ search_query }}&amp;{% endif %}page={{ page_obj.next_page_number }}" class="page-link">Next</a>
        </li>
      {% endif %}
    </ul>
  </nav>
{% endif %}
