{% if is_paginated %}
  <ul class="pagination">
    {% if page_obj.has_previous %}
      <li class="page-item">
        <a href="?{% if request.GET.username %}username={{ request.GET.username }}&{% endif %}{% if request.GET.model %}model={{ request.GET.model }}&{% endif %}{% if request.GET.name %}name={{ request.GET.name }}&{% endif %}page={{ page_obj.previous_page_number }}"
           class="page-link">
          prev
        </a>
      </li>
    {% endif %}

    <li class="page-item active">
      <span class="page-link">{{ page_obj.number }} of {{ paginator.num_pages }}</span>
    </li>

    {% if page_obj.has_next %}
      <li class="page-item">
        <a href="?{% if request.GET.username %}username={{ request.GET.username }}&{% endif %}{% if request.GET.model %}model={{ request.GET.model }}&{% endif %}{% if request.GET.name %}name={{ request.GET.name }}&{% endif %}page={{ page_obj.next_page_number }}"
           class="page-link">
          next
        </a>
      </li>
    {% endif %}
  </ul>
{% endif %}
