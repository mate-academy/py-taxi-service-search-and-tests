<form method="get" action="" class="form-inline my-2 my-lg-0">
  <input
    class="form-control mr-sm-2"
    type="search"
    name="q"
    placeholder="Search..."
    value="{{ request.GET.q }}"
    aria-label="Search"
  >
  <button class="btn btn-outline-success my-2 my-sm-0" type="submit">Search</button>
  {% if request.GET.q %}
    <a href="{{ request.path }}" class="btn btn-outline-secondary ml-2">Clear</a>
  {% endif %}
</form>
