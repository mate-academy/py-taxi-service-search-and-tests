<ul class="sidebar-nav list-group">
  {% if user.is_authenticated %}
    <li class="list-group-item">
      User: <a href="{{ user.get_absolute_url }}">{{ user.get_username }}</a>
    </li>
    <li class="list-group-item">
      <form action="{% url 'logout' %}" method="post" style="display:inline;">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger btn-sm">Logout</button>
      </form>
    </li>
  {% else %}
    <li class="list-group-item">
      <a href="{% url 'login' %}?next={{ request.path }}">Login</a>
    </li>
  {% endif %}

  <br>

  <li class="list-group-item {% if request.path == '/' %}active{% endif %}">
    <a href="{% url 'taxi:index' %}">Home</a>
  </li>
  <li class="list-group-item {% if request.path|slice:":8" == '/drivers' %}active{% endif %}">
    <a href="{% url 'taxi:driver-list' %}">All drivers</a>
  </li>
  <li class="list-group-item {% if request.path|slice:":5" == '/cars' %}active{% endif %}">
    <a href="{% url 'taxi:car-list' %}">All cars</a>
  </li>
  <li class="list-group-item {% if request.path|slice:":14" == '/manufacturers' %}active{% endif %}">
    <a href="{% url 'taxi:manufacturer-list' %}">All manufacturers</a>
  </li>
</ul>
