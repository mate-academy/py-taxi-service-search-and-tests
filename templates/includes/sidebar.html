<div class="list-group">
  {% if user.is_authenticated %}
    <div class="list-group-item list-group-item-primary">
        <strong>User:</strong>
        <a href="{{ user.get_absolute_url }}" class="text-dark">{{ user.get_username }}</a>
    </div>
    <a href="{% url 'logout'%}?next={{request.path}}" class="list-group-item list-group-item-action text-danger">
        Logout
    </a>
  {% else %}
    <a href="{% url 'login'%}?next={{request.path}}" class="list-group-item list-group-item-action list-group-item-success">
        Login
    </a>
  {% endif %}

  <div class="py-2"></div>

  <a href="{% url 'taxi:index' %}" class="list-group-item list-group-item-action">
    Home
  </a>
  <a href="{% url 'taxi:driver-list' %}" class="list-group-item list-group-item-action">
    All drivers
  </a>
  <a href="{% url 'taxi:car-list' %}" class="list-group-item list-group-item-action">
    All cars
  </a>
  <a href="{% url 'taxi:manufacturer-list' %}" class="list-group-item list-group-item-action">
    All manufacturers
  </a>
</div>
