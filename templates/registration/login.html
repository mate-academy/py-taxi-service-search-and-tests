{% extends "base.html" %}

{% block content %}
    <h1>Login</h1>

    {% if form.errors %}
        <p style="color: red;">
            Username or password is incorrect. Please try again.
        </p>
    {% endif %}

    <form method="post" action="{% url 'login' %}">
        {% csrf_token %}

        {{ form.as_p }}

        <input type="submit" value="Login">
        <input type="hidden" name="next" value="{{ next }}">
    </form>
{% endblock %}
