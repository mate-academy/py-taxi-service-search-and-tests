{% extends "base.html" %}

{% block content %}
  <h1>
    {{ driver.first_name }} {{ driver.last_name }}
    <a href="{% url 'taxi:driver-update' driver.pk %}"><i class="bi bi-pencil-square"></i></a>
    <a href="{% url 'taxi:driver-delete' driver.id %}"><i class="bi bi-trash-fill"></i></a>
  </h1>
  <ul>
    <li><i class="bi bi-globe"></i> {{ driver.username }}</li>
    <li><i class="bi bi-tools"></i> {{ driver.license_number }}</li>
  </ul>
  <h3>Drives this cars</h3>
  <hr>
  {% if driver.cars.all %}
    <ul>
      {% for car in driver.cars.all %}
        <li>
          <i class="bi bi-car-front"></i>  {{ car.model }}
        </li>
      {% endfor %}
    </ul>
  {% endif %}
{% endblock %}
