{% extends "base.html" %}

{% block content %}
  <h1>
    Car list
    <a href="{% url 'taxi:car-create' %}" class="btn btn-primary link-to-page">
      Create
    </a>
  </h1>
  {% if car_list %}
    <ul>
      {% for car in car_list %}
        <li>
          <a href="{% url "taxi:car-detail" pk=car.id %} ">{{ car.id }}</a>
          {{ car.model }} ({{ car.manufacturer.name }})
        </li>
      {% endfor %}
      <form method="get" action="">
        <input
          type="text"
          name="model"
          placeholder="Search by car model"
          value="{{ request.GET.model }}"
        >
        <button type="submit" class="btn btn-primary">Search</button>
        <a href="{% url 'taxi:car-list' %}" class="btn btn-secondary">
          Reset
        </a>
      </form>
    </ul>
  {% else %}
    <p>There are no cars in taxi</p>
  {% endif %}
{% endblock %}
