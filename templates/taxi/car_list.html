{% extends "base.html" %}

{% block content %}
  <h1>
    Car list

    <a
      href="{% url "taxi:car-create" %}"
      class="btn btn-primary"
    >
      Create
    </a>
  </h1>

  <form method="get" class="mb-3">
    <input
      type="text"
      name="search"
      placeholder="Search by model"
      value="{{ search }}"
      class="form-control"
    >
  </form>

  {% if car_list %}
    <ul>
      {% for car in car_list %}
        <li>
          <a href="{% url "taxi:car-detail" pk=car.id %}">
            {{ car.id }}
          </a>
          {{ car.model }}
          ({{ car.manufacturer.name }})
        </li>
      {% endfor %}
    </ul>
  {% else %}
    <p>There are no cars in taxi</p>
  {% endif %}
{% endblock %}
