{% extends "base.html" %}

{% block content %}
  <h1>
    Car list
    <a href="{% url 'taxi:car-create' %}" class="btn btn-primary link-to-page">
      Create
    </a>
  </h1>

  <form method="get" class="form-inline mb-3">
    <label for="car-search" class="mr-2">Search by model</label>
    <input
      id="car-search"
      class="form-control mr-2"
      type="search"
      name="model"
      value="{{ request.GET.model }}"
      placeholder="Car model"
    >
    <button class="btn btn-secondary" type="submit">Search</button>
  </form>

  {% if car_list %}
    <ul>
      {% for car in car_list %}
        <li>
          <a href="{% url 'taxi:car-detail' pk=car.id %}">{{ car.id }}</a>
          {{ car.model }} ({{ car.manufacturer.name }})
        </li>
      {% endfor %}
    </ul>
  {% else %}
    <p>There are no cars in taxi</p>
  {% endif %}
{% endblock %}
