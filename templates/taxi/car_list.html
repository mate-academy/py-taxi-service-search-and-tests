{% extends "base.html" %}

{% block content %}
    <h1>
      Car List
      <a href="{% url 'taxi:car-create' %}" class="btn btn-primary link-to-page">
        Create
      </a>
    </h1>

    <!-- Search Form -->
    <form method="GET" action="{% url 'taxi:car-list' %}" class="mb-3">
        <input type="text" name="q" placeholder="Search by model..." value="{{ request.GET.q }}" class="form-control w-25 d-inline">
        <button type="submit" class="btn btn-secondary">Search</button>
    </form>

    {% if car_list %}
    <table class="table table-striped">
      <thead>
        <tr>
          <th>ID</th>
          <th>Model</th>
          <th>Manufacturer</th>
          <th>Details</th>
        </tr>
      </thead>
      <tbody>
        {% for car in car_list %}
          <tr>
            <td>{{ car.id }}</td>
            <td>{{ car.model }}</td>
            <td>{{ car.manufacturer.name }}</td>
            <td><a href="{% url 'taxi:car-detail' car.id %}" class="btn btn-info">View</a></td>
          </tr>
        {% endfor %}
      </tbody>
    </table>
    {% else %}
      <p>No cars found.</p>
    {% endif %}
{% endblock %}
