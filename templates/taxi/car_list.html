{% extends "base.html" %}

{% block content %}
  <h1>
    Car List
    <a href="{% url 'taxi:car-create' %}" class="btn btn-primary link-to-page">
      Create
    </a>
  </h1>

  <form method="GET" action="{% url 'taxi:car-list' %}">
    <input type="text" name="q" value="{{ request.GET.q }}" placeholder="Search cars..." aria-label="Search cars">
    <button type="submit" class="btn btn-secondary">Search</button>
  </form>

  {% if car_list %}
    <ul>
      {% for car in car_list %}
        <li>
          <a href="{% url 'taxi:car-detail' pk=car.id %}">{{ car.model }}</a> ({{ car.manufacturer.name }})
        </li>
      {% endfor %}
    </ul>
  {% else %}
    <p>There are no cars in the taxi service.</p>
  {% endif %}
{% endblock %}
