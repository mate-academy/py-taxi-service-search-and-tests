{% extends "base.html" %}

{% block content %}
  <h1>
    Car List
    <a href="{% url 'taxi:car-create' %}">+</a>
  </h1>

  <form method="get" action="">
    {{ search_form }}
    <input type="submit" value="Search">
  </form>

  {% if car_list %}
    <ul>
      {% for car in car_list %}
        <li>
          <a href="{% url 'taxi:car-detail' pk=car.id %}">
            {{ car.model }}
          </a>
          ({{ car.manufacturer.name }})
        </li>
      {% endfor %}
    </ul>
  {% else %}
    <p>No cars found.</p>
  {% endif %}

  {% include "includes/pagination.html" %}
{% endblock %}
