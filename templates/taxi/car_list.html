{% extends "base.html" %}

{% block content %}
    <h1>Car List</h1>

    <form method="get">
        <input type="text" name="q" placeholder="Search by model..." value="{{ request.GET.q }}">
        <button type="submit" class="btn btn-primary">Search</button>
    </form>

    <a href="{% url 'taxi:car-create' %}" class="btn btn-primary mb-3">Create Car</a>

    {% if car_list %}
        <ul>
            {% for car in car_list %}
                <li>
                    <a href="{{ car.get_absolute_url }}">{{ car.model }}</a> - {{ car.manufacturer.name }}
                </li>
            {% endfor %}
        </ul>
    {% else %}
        <p>No cars found.</p>
    {% endif %}
{% endblock %}
