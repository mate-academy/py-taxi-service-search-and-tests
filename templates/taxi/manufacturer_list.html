{% extends "base.html" %}

{% block content %}
    <h1>Manufacturers</h1>

    <form method="get">
        <input type="text" name="q" placeholder="Search by name..." value="{{ request.GET.q }}">
        <button type="submit" class="btn btn-primary">Search</button>
    </form>

    <a href="{% url 'taxi:manufacturer-create' %}" class="btn btn-primary mb-3">Create Manufacturer</a>

    {% if manufacturer_list %}
        <ul>
            {% for manufacturer in manufacturer_list %}
                <li>{{ manufacturer.name }} ({{ manufacturer.country }})</li>
            {% endfor %}
        </ul>
    {% else %}
        <p>No manufacturers found.</p>
    {% endif %}
{% endblock %}
