{% extends "base.html" %}

{% block content %}
  <h1>
    Manufacturer list

    <a
        href="{% url 'taxi:manufacturer-create' %}"
        class="btn btn-primary link-to-page"
    >
      Create
    </a>
  </h1>

  <form method="get" action="">
    <div class="form-group">
      <label for="name">Search by name:</label>

      <input
          type="text"
          name="name"
          id="name"
          value="{{ request.GET.name }}"
          class="form-control"
      >
    </div>

    <button type="submit" class="btn btn-primary">
      Search
    </button>
  </form>

  {% if manufacturer_list %}
    <ul>
      {% for manufacturer in manufacturer_list %}
        <li>
          <a
              href="{% url 'taxi:manufacturer-update' pk=manufacturer.id %}"
          >
            {{ manufacturer.name }}
          </a>
          ({{ manufacturer.country }})
        </li>
      {% endfor %}
    </ul>
  {% else %}
    <p>There are no manufacturers in taxi.</p>
  {% endif %}
{% endblock %}
