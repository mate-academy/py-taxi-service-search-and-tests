{% extends "base.html" %}

{% block content %}
  <h1>Delete driver</h1>
  <p>Are you sure you want to delete {{ object.username }}?</p>
  <p>The driver's car assignments will be removed. The cars will remain.</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Delete driver</button>
    <a href="{{ object.get_absolute_url }}" class="btn btn-secondary">Cancel</a>
  </form>
{% endblock %}
