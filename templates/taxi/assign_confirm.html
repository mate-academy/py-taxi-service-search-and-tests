{% extends "base.html" %}

{% block title %}Remove from Car | Taxi Service{% endblock %}

{% block content %}
  <div class="container text-center">
    <h1 class="text-danger">Car: {{ car.model }}</h1>

    <p>Are you sure you want to <strong>remove yourself</strong> from this car?</p>
    <p class="text-danger"><strong>Note:</strong> You will no longer be assigned as a driver for this car.</p>

    <form action="" method="post" class="mt-4">
      {% csrf_token %}
      <button type="submit" name="assign" value="remove" class="btn btn-danger">Yes, remove me</button>
      <a href="{% url 'taxi:car-detail' car.id %}" class="btn btn-secondary">Cancel</a>
    </form>
  </div>
{% endblock %}
