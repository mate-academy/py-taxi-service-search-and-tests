{% extends "base.html" %}

{% block content %}
  <div class="delete-confirmation text-center">
    <h1>Delete manufacturer?</h1>
    <p class="lead mb-4">Are you sure you want to delete this manufacturer?</p>
    <form action="" method="post">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger btn-lg mr-3">Yes, delete</button>
      <a href="{% url 'taxi:manufacturer-list' %}" class="btn btn-secondary btn-lg">Cancel</a>
    </form>
  </div>
{% endblock %}
