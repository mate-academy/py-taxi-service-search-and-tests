{% extends "base.html" %}

{% block content %}
<h1>Drivers</h1>

<form method="get" class="mb-3">
  <input type="text" name="username" value="{{ request.GET.username }}" class="form-control" placeholder="Search by username">
  <button type="submit" class="btn btn-primary mt-2">Search</button>
</form>

<ul>
  {% for driver in driver_list %}
    <li>{{ driver.username }}</li>
  {% empty %}
    <li>No drivers found.</li>
  {% endfor %}
</ul>
{% endblock %}
