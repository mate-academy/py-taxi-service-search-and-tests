{% extends "base.html" %}
{% load crispy_forms_filters %}

{% block content %}
  <div class="card">
    <div class="card-header">
      <h3 class="mb-0">{{ object|yesno:"Update,Create" }} Driver</h3>
    </div>
    <div class="card-body">
      <form action="" method="post" novalidate>
        {% csrf_token %}
        {{ form|crispy }}
        <div class="form-group mt-4">
          <button type="submit" class="btn btn-primary btn-lg">Submit</button>
          <a href="{% url 'taxi:driver-list' %}" class="btn btn-secondary btn-lg ml-2">Cancel</a>
        </div>
      </form>
    </div>
  </div>
{% endblock %}
