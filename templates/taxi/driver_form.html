{% extends "base.html" %}
{% load crispy_forms_filters %}

{% block content %}
  <h1>Create driver</h1>
  <form action="" method="post" novalidate>
    {% csrf_token %}
    {{ form|crispy }}
    <div class="mt-3">
      <input type="submit" value="Submit" class="btn btn-primary">
      <a href="{{ request.META.HTTP_REFERER|default:'taxi:driver-list' }}" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
{% endblock %}
