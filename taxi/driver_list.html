{% extends "taxi/base.html" %}

{% block content %}
  <h1>Drivers</h1>

  {% include "includes/search_form.html" %}

  <ul>
    {% for driver in driver_list %}
      <li>
        <a href="{% url 'taxi:driver-detail' driver.id %}">
          {{ driver.username }}
        </a>
      </li>
    {% empty %}
      <li>No drivers found</li>
    {% endfor %}
  </ul>
{% endblock %}
